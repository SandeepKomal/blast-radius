name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # golangci-lint is pinned, so lint with the Go it supports (our minimum).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.24"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.1.6
      - name: Lint e2e tests
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.1.6
          args: --build-tags e2e ./e2e/...

  secrets:
    # Scan every commit for committed keys, tokens and passwords.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - name: gitleaks
        run: go run github.com/zricethezav/gitleaks/v8@v8.21.2 git . --no-banner --redact --verbose

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-input: stable

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.24", stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - name: Test
        if: runner.os != 'Windows'
        run: go test -race -count=1 ./...
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: go test -count=1 ./...
      - run: go build .

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - run: go test ./internal/shell/ -run '^$' -fuzz FuzzParse -fuzztime 60s

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_wrapper: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6
      - name: Install terragrunt
        run: |
          curl -sSfL -o "$RUNNER_TEMP/terragrunt" https://github.com/gruntwork-io/terragrunt/releases/download/v0.69.1/terragrunt_linux_amd64
          # Checksum from the release's SHA256SUMS; refuse anything else.
          echo "eb0e3558bb453241301126a15a9eeee3592817d8013ddd44793aeac168da9ad1  $RUNNER_TEMP/terragrunt" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/terragrunt"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - name: Tool versions
        run: |
          terraform version
          tofu version
          terragrunt --version
          helm version --short
          pulumi version
          gcloud version | head -1
          kubectl version --client
      - name: End-to-end tests
        env:
          BLAST_RADIUS_E2E_KUBE: "1"
        run: go test -tags e2e -count=1 -v ./e2e/

  e2e-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false
      - name: End-to-end tests
        run: go test -tags e2e -count=1 -v -run "TestTerraform|TestHookBinary|TestEvasion" ./e2e/
